; virtual-cockpit: LVGL instrument cluster firmware for the Toyota Yaris Hybrid
; (3rd gen / XP130). Target board: Waveshare ESP32-S3-Touch-LCD-3.49
; (ESP32-S3R8, 8MB PSRAM, 16MB flash) -- same hardware as ../obd-capture.

[env:waveshare-esp32s3-lcd349]
; See ../obd-capture/platformio.ini for the rationale: the pioarduino fork
; ships arduino-esp32 3.x (IDF5-based), required by GFX Library for Arduino's
; ESP32 QSPI databus driver (esp32-hal-periman.h).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.9
    https://github.com/lewisxhe/SensorsLib.git
    lvgl/lvgl @ 8.3.11

; Optional bench bring-up mode (stage 1/2 of the plan's bring-up order):
;   pio run -e demo -t upload
; builds with DEMO_FAKE_DATA defined, sweeping VehicleState with fake values
; and skipping TWAI init entirely, so the UI can be verified without a car.
[env:demo]
extends = env:waveshare-esp32s3-lcd349
build_flags =
    ${env:waveshare-esp32s3-lcd349.build_flags}
    -DDEMO_FAKE_DATA
