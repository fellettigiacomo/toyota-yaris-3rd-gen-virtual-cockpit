; mode-button-test: reads the steering-wheel MODE button (radio line SW2)
; on a "Tiny RP2040" (WisdPi-style, WS2812 on GP29) and lights the onboard RGB LED.
; Wiring and usage: see README.md.

[platformio]
default_envs = rp2040-tiny

[env:rp2040-tiny]
; Earle Philhower's arduino-pico core, through Max Gerhardt's platform fork
; (the official platformio raspberrypi platform only ships the Mbed core).
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

monitor_speed = 115200

[env:diag]
extends = env:rp2040-tiny
build_src_filter = -<*> +<../diag/>
