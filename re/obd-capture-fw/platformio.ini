; obd-capture: raw CAN bus logger for the Toyota Yaris Hybrid (3rd gen / XP130)
; Target board: Waveshare ESP32-S3-Touch-LCD-3.49 (ESP32-S3R8, 8MB PSRAM, 16MB flash)

[env:waveshare-esp32s3-lcd349]
; Uses the pioarduino community platform fork instead of the official
; platformio espressif32 platform: it bundles arduino-esp32 3.x (IDF5-based),
; needed for the QSPI quad_mode support in esp_lcd_panel_io_spi_config_t that
; src/display_ui.cpp uses to drive the display (see src/axs15231b/ and
; src/WAVESHARE_VENDORED.md -- same reason firmware/platformio.ini gives).
; The official platformio registry package was still pinned to arduino-esp32
; 2.0.17 at the time this project was written.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; GFX Library for Arduino is kept only for its headless Arduino_Canvas
; (RAM-only framebuffer + bitmap-font text rendering) -- not for its
; hardware AXS15231B panel driver, which display_ui.cpp no longer uses.
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.9
    https://github.com/lewisxhe/SensorsLib.git
