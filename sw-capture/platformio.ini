; sw-capture: ADC characterization logger for the steering-wheel switch
; resistive ladder (MODE & friends) of the Toyota Yaris Hybrid (3rd gen /
; XP130). See README.md for wiring and docs/signal_findings.md Addendum 5
; for why this exists: the MODE button does NOT transit on the CAN bus, it
; lives on the analog SW lines of the 28-pin radio connector.
;
; Target board: generic ESP32-C3 mini / "SuperMini" (4MB flash, native
; USB-Serial-JTAG) -- deliberately NOT the Waveshare ESP32-S3 used by
; obd-capture/virtual-cockpit, so the cluster hardware stays untouched
; while probing the car.

[env:esp32c3-mini]
; Same pioarduino platform pin as the other two projects in this repo
; (arduino-esp32 3.x / IDF5), for consistency -- this project has no hard
; dependency on 3.x features.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    ; C3 SuperMini boards expose only the native USB-Serial-JTAG port:
    ; route Serial there so flashing and logging use the same cable.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
